name: Godot checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select runner JDK 17
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          archive=Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$archive"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $RUNNER_TEMP/$archive" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Import project
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import --quit
      - name: Run economy tests
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_economy.gd
      - name: Run scene interaction tests
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_ui.gd
      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          test -d "$ANDROID_HOME/platforms/android-35"
      - name: Install Godot Android templates
        shell: bash
        run: |
          set -euo pipefail
          archive=Godot_v4.7.2-stable_export_templates.tpz
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$archive"
          echo "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  $RUNNER_TEMP/$archive" | sha256sum --check
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j -q "$RUNNER_TEMP/$archive" 'templates/android_debug.apk' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF
      - name: Export debug APK
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug Android build/idle-city-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: idle-city-debug-apk
          path: build/idle-city-debug.apk
          if-no-files-found: error
